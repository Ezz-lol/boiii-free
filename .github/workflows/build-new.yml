name: BuildNew

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: BuildNew
    runs-on: windows-2025
    outputs:
      version: ${{ steps.get-version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        configuration:
          - Debug
          - Release
    steps:
      - name: Check out files
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
          # NOTE - If LFS ever starts getting used during builds, switch this to true!
          lfs: false

      - name: Get version from trigger tag
        id: get-version
        run: |
          version="${GITHUB_REF_NAME}"
          echo "version=$version" >> $GITHUB_OUTPUT
        shell: bash

      - name: Setup LLVM
        uses: ZhongRuoyu/setup-llvm@v0
        with:
          llvm-version: 23

      - name: Install premake5
        uses: Jarod42/install-premake5@v7
        with:
          msdev: vs2026
          ref: 5.0.0

      - name: Generate project files
        run: premake5 ninja

      - name: Build ${{matrix.configuration}}
        run: ninja ${{matrix.configuration}}_x64 -Cbuild

      - name: Upload ${{matrix.configuration}} symbols
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4 # Updated from v3.1.3
        with:
          name: ${{matrix.configuration}} Symbols
          path: |
            build/bin/x64/${{matrix.configuration}}/boiii.pdb

      - name: Upload ${{matrix.configuration}} binary
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4 # Updated from v3.1.3
        with:
          name: ${{matrix.configuration}} Binary
          path: |
            build/bin/x64/${{matrix.configuration}}/boiii.exe

      - name: Upload ${{matrix.configuration}} data artifacts
        if: matrix.configuration == 'Release'
        uses: actions/upload-artifact@v4 # Updated from v3.1.3
        with:
          name: ${{matrix.configuration}} data artifacts
          path: |
            data/*

  create_release:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download boiii.exe
        uses: actions/download-artifact@v4 # Updated from v3
        with:
          name: Release Binary
          path: artifacts

      - name: Create a Release
        uses: marvinpinto/action-automatic-releases@latest
        with:
          repo_token: ${{ secrets.TOKEN }}
          automatic_release_tag: ${{ needs.build.outputs.version }}
          title: Release ${{ needs.build.outputs.version }}
          prerelease: false
          files: |
            artifacts/boiii.exe
