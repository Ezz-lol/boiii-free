services:
  base:
    image: boiii-free-dev:latest
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - .:/workspace
    working_dir: /workspace

  format:
    extends: base
    command: ["./scripts/unix/format.sh"]

  debug:
    extends: base
    command: ["./scripts/unix/cross.sh", "--builder", "ninja"]
  debug-verbose:
    extends: base
    command: ["./scripts/unix/cross.sh", "--builder", "ninja", "--verbose"]
  debug-clean:
    extends: base
    command: ["./scripts/unix/cross.sh", "--builder", "ninja", "--clean"]
  debug-clean-verbose:
    extends: base
    command:
      ["./scripts/unix/cross.sh", "--builder", "ninja", "--clean", "--verbose"]

  release:
    extends: base
    command:
      ["./scripts/unix/cross.sh", "--builder", "ninja", "--release", "--clean"]
  release-verbose:
    extends: base
    command:
      [
        "./scripts/unix/cross.sh",
        "--builder",
        "ninja",
        "--release",
        "--clean",
        "--verbose",
      ]

  gmake-debug:
    extends: base
    command: ["./scripts/unix/cross.sh", "--builder", "gmake"]
  gmake-debug-verbose:
    extends: base
    command: ["./scripts/unix/cross.sh", "--builder", "gmake", "--verbose"]
  gmake-debug-clean:
    extends: base
    command: ["./scripts/unix/cross.sh", "--builder", "gmake", "--clean"]

  gmake-debug-clean-verbose:
    extends: base
    command:
      ["./scripts/unix/cross.sh", "--builder", "gmake", "--clean", "--verbose"]

  gmake-release:
    extends: base
    command:
      ["./scripts/unix/cross.sh", "--builder", "gmake", "--release", "--clean"]
  gmake-release-verbose:
    extends: base
    command:
      [
        "./scripts/unix/cross.sh",
        "--builder",
        "gmake",
        "--release",
        "--clean",
        "--verbose",
      ]
